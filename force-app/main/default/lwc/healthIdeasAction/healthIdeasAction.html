<template>
    <lightning-quick-action-panel header="Get Records">
        <div class="slds-p-around_medium">
            <lightning-input type="date" label="Select Date" value={selectedDate} onchange={handleDateChange} required>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-input type="checkbox" label="Use Batch Process" checked={isASyncCall}
                    onchange={handleAsyncCheckboxChange}>
                </lightning-input>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button label="Get Records" variant="brand" onclick={handleRun} disabled={isLoading}>
                </lightning-button>
            </div>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    <div class="slds-is-relative slds-p-around_medium">
                        <lightning-spinner alternative-text="Processing" size="medium">
                        </lightning-spinner>
                    </div>

                    <div class="slds-m-top_medium">
                        <template if:false={isASyncCall}>
                            <div class="slds-text-body_regular slds-m-bottom_x-small">
                                {processingMessage}
                            </div>
                        </template>

                        <template if:true={isASyncCall}>
                            <template if:true={progressStatusLabel}>
                                <div class="slds-text-body_regular slds-m-bottom_x-small">
                                    {progressStatusLabel}
                                </div>
                            </template>

                            <template if:true={showProgressDetails}>
                                <lightning-progress-bar value={progressValue} size="medium">
                                </lightning-progress-bar>

                                <div class="slds-m-top_x-small slds-text-body_small">
                                    {progressLabel}
                                </div>
                            </template>
                        </template>
                    </div>
                </div>
            </template>

            <template if:true={result}>
                <div class="slds-m-top_medium slds-text-color_success">
                    {result}
                </div>
            </template>

            <template if:true={hasMessages}>
                <div class="slds-m-top_medium">
                    <div class="slds-text-body_regular slds-m-bottom_x-small">
                        {partialSuccessText}
                    </div>
                    <ul class="slds-list_dotted slds-m-left_medium">
                        <template for:each={messages} for:item="message">
                            <li key={message} class="slds-m-bottom_x-small slds-text-body_regular">
                                {message}
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
