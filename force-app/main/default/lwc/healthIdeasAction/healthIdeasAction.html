<template>
    <lightning-quick-action-panel header="Get Records">
        <div class="slds-p-around_medium">
            <lightning-input type="date" label="Select Date" value={selectedDate} onchange={handleDateChange} required>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-input type="checkbox" label="Use Batch Process" checked={isASyncCall}
                    onchange={handleAsyncCheckboxChange}>
                </lightning-input>
            </div>

            <div class="slds-m-top_medium">
                <lightning-button label="Get Records" variant="brand" onclick={handleRun} disabled={isLoading}>
                </lightning-button>
            </div>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    Processing...
                </div>
            </template>

            <template if:true={isLoading}>
                <div class="slds-m-top_medium slds-is-relative">
                    <lightning-spinner alternative-text="Loading" size="medium">
                    </lightning-spinner>
                </div>
            </template>

            <template if:true={result}>
                <div class="slds-m-top_medium slds-text-color_success">
                    {result}
                </div>
            </template>

            <template if:true={hasMessages}>
                <div class="slds-m-top_medium">
                    <div class="slds-text-body_regular slds-m-bottom_x-small">
                        {partialSuccessText}
                    </div>
                    <ul class="slds-list_dotted slds-m-left_medium">
                        <template for:each={messages} for:item="message">
                            <li key={message} class="slds-m-bottom_x-small slds-text-body_regular">
                                {message}
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
        </div>
    </lightning-quick-action-panel>
</template>
